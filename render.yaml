services:
  - type: web
    name: marc21-generator
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LIBRARY_ID
        value: demo
      - key: LIBRARY_NAME
        value: Biblioteca demo
      - key: METRICS_FILE
        value: /var/data/metrics.json
    disk:
      name: metrics-data
      mountPath: /var/data
      sizeGB: 1
